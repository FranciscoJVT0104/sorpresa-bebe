<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una dulce sorpresa - Revelación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================
   PALETA DE COLORES VIBRANTES Y FESTIVOS
   ========================================== */
:root{
  --bg-gradient: linear-gradient(135deg, #ebd8fc 0%, #fedceb 30%, #d3f2fe 68%, #ffeed0 100%);
  --orb1: rgba(186, 104, 255, 0.65);
  --orb2: rgba(30, 215, 185, 0.58);
  --orb3: rgba(255, 140, 70, 0.55);
  --card-bg: rgba(255, 255, 255, 0.94);
  --ink: #221c3b; --muted: #5e577c;
  --gold: #d49b28; --gold-light: #fcd56e; --gold-glow: rgba(212, 155, 40, 0.38);
  --boy: #0088ff; --boy-deep: #0c4d9e; --boy-soft: #d6eeff;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-gradient: linear-gradient(135deg, #251642 0%, #152d3a 50%, #342410 100%);
    --orb1: rgba(165, 80, 245, 0.5);
    --orb2: rgba(25, 195, 165, 0.45);
    --orb3: rgba(240, 130, 50, 0.42);
    --card-bg: rgba(36, 30, 54, 0.93);
    --ink: #ffffff; --muted: #cbbfdc;
    --gold: #f7c552; --gold-light: #ffe594; --gold-glow: rgba(247, 197, 82, 0.45);
    --boy-soft: #183e66;
  }
}

/* Transición vibrante y radiante al revelar que es un niño */
body.boy{
  --bg-gradient: linear-gradient(135deg, #74c7ff 0%, #bde5ff 35%, #76cdff 70%, #aee3ff 100%);
  --orb1: rgba(0, 140, 255, 0.75);
  --orb2: rgba(0, 220, 255, 0.7);
  --orb3: rgba(255, 195, 60, 0.65);
  --ink: #072a50; --muted: #225686;
  --card-bg: rgba(255, 255, 255, 0.97);
  --boy-soft: #cdeaff;
}

@media (prefers-color-scheme: dark){
  body.boy{
    --bg-gradient: linear-gradient(135deg, #071f3a 0%, #0d3257 50%, #0a2542 100%);
    --orb1: rgba(24, 130, 245, 0.6);
    --orb2: rgba(0, 190, 235, 0.5);
    --orb3: rgba(235, 175, 55, 0.45);
    --ink: #ffffff; --muted: #b8dcff;
    --card-bg: rgba(16, 38, 64, 0.94);
  }
}

*{box-sizing:border-box;margin:0}
html,body{height:100%}

body{
  font-family:"DM Sans",system-ui,sans-serif;
  color:var(--ink);
  background: var(--bg-gradient);
  transition: background 1.5s ease;
  overflow-x:hidden;
  position:relative;
}

/* ==========================================
   ATMÓSFERA Y POLVO DE ESTRELLAS CON PARPADEO
   ========================================== */
.bg-atmosphere{
  position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;
}

.ambient-orb{
  position:absolute;border-radius:50%;filter:blur(85px);
  transition:background 1.5s ease, transform 1.5s ease;
}
.orb-1{
  width:530px;height:530px;top:-120px;left:-100px;background:var(--orb1);
  animation:driftOrb1 20s ease-in-out infinite alternate;
}
.orb-2{
  width:470px;height:470px;bottom:-100px;right:-90px;background:var(--orb2);
  animation:driftOrb2 24s ease-in-out infinite alternate;
}
.orb-3{
  width:380px;height:380px;top:38%;left:65%;background:var(--orb3);
  animation:driftOrb3 18s ease-in-out infinite alternate;
}
@keyframes driftOrb1{0%{transform:translate(0,0)}100%{transform:translate(90px,70px) scale(1.15)}}
@keyframes driftOrb2{0%{transform:translate(0,0)}100%{transform:translate(-80px,-60px) scale(1.12)}}
@keyframes driftOrb3{0%{transform:translate(0,0)}100%{transform:translate(-60px,50px) scale(0.92)}}

/* Capas densas de polvo de estrellas parpadeante */
.stardust{position:absolute;inset:0;pointer-events:none}
.stardust-1{
  background-image:
    radial-gradient(1.3px 1.3px at 8% 12%, var(--gold) 100%, transparent),
    radial-gradient(1.6px 1.6px at 18% 28%, #ffffff 100%, transparent),
    radial-gradient(1.3px 1.3px at 28% 8%, var(--gold) 100%, transparent),
    radial-gradient(1.7px 1.7px at 38% 32%, var(--gold-light) 100%, transparent),
    radial-gradient(1.3px 1.3px at 52% 16%, #ffffff 100%, transparent),
    radial-gradient(1.6px 1.6px at 68% 12%, var(--gold) 100%, transparent),
    radial-gradient(1.3px 1.3px at 82% 24%, var(--gold-light) 100%, transparent),
    radial-gradient(1.7px 1.7px at 92% 14%, #ffffff 100%, transparent),
    radial-gradient(1.3px 1.3px at 12% 64%, var(--gold-light) 100%, transparent),
    radial-gradient(1.6px 1.6px at 22% 82%, var(--gold) 100%, transparent),
    radial-gradient(1.3px 1.3px at 42% 90%, #ffffff 100%, transparent),
    radial-gradient(1.6px 1.6px at 62% 76%, var(--gold) 100%, transparent),
    radial-gradient(1.3px 1.3px at 78% 88%, var(--gold-light) 100%, transparent),
    radial-gradient(1.7px 1.7px at 88% 66%, #ffffff 100%, transparent),
    radial-gradient(1.3px 1.3px at 94% 84%, var(--gold) 100%, transparent);
  animation:twinkleA 2.5s ease-in-out infinite alternate;
}

.stardust-2{
  background-image:
    radial-gradient(2px 2px at 5% 42%, var(--gold-light) 100%, transparent),
    radial-gradient(2.3px 2.3px at 15% 18%, #ffffff 100%, transparent),
    radial-gradient(2px 2px at 24% 48%, var(--gold) 100%, transparent),
    radial-gradient(2.5px 2.5px at 33% 22%, var(--gold-light) 100%, transparent),
    radial-gradient(2px 2px at 48% 6%, #ffffff 100%, transparent),
    radial-gradient(2.3px 2.3px at 63% 26%, var(--gold) 100%, transparent),
    radial-gradient(2px 2px at 74% 8%, var(--gold-light) 100%, transparent),
    radial-gradient(2.6px 2.6px at 86% 36%, #ffffff 100%, transparent),
    radial-gradient(2px 2px at 8% 78%, var(--gold) 100%, transparent),
    radial-gradient(2.3px 2.3px at 32% 70%, var(--gold-light) 100%, transparent),
    radial-gradient(2px 2px at 56% 84%, #ffffff 100%, transparent),
    radial-gradient(2.5px 2.5px at 72% 62%, var(--gold) 100%, transparent),
    radial-gradient(2px 2px at 84% 78%, var(--gold-light) 100%, transparent),
    radial-gradient(2.3px 2.3px at 96% 48%, #ffffff 100%, transparent);
  animation:twinkleB 3.6s ease-in-out infinite alternate 1s;
}

.stardust-3{
  background-image:
    radial-gradient(3px 3px at 10% 88%, var(--gold-light) 100%, transparent),
    radial-gradient(2.6px 2.6px at 26% 94%, #ffffff 100%, transparent),
    radial-gradient(3.2px 3.2px at 44% 82%, var(--gold) 100%, transparent),
    radial-gradient(2.6px 2.6px at 70% 92%, #ffffff 100%, transparent),
    radial-gradient(3px 3px at 90% 96%, var(--gold-light) 100%, transparent);
  animation:twinkleC 4.4s ease-in-out infinite alternate 1.7s;
}

@keyframes twinkleA{
  0%{opacity:0.25;transform:translateY(0)}
  50%{opacity:0.95;transform:translateY(-2px) scale(1.06)}
  100%{opacity:0.25;transform:translateY(0)}
}
@keyframes twinkleB{
  0%{opacity:0.85;transform:scale(1)}
  50%{opacity:0.18;transform:scale(0.85)}
  100%{opacity:0.85;transform:scale(1)}
}
@keyframes twinkleC{
  0%{opacity:0.2;filter:brightness(0.9)}
  50%{opacity:1;filter:brightness(1.6)}
  100%{opacity:0.2;filter:brightness(0.9)}
}

/* Destellos en cruz (✦ y ✧) con brillo oro intenso */
.sparkle{
  position:absolute;color:var(--gold);line-height:1;
  pointer-events:none;user-select:none;
  animation:sparkleGleam 3.2s ease-in-out infinite;
}
.sp-1{top:11%;left:9%;font-size:1.45rem;animation-delay:0s}
.sp-2{top:19%;right:11%;font-size:1.05rem;color:var(--gold-light);animation-delay:1.1s}
.sp-3{top:45%;left:6%;font-size:1.25rem;animation-delay:1.8s}
.sp-4{top:61%;right:7%;font-size:1.5rem;animation-delay:0.5s}
.sp-5{top:81%;left:12%;font-size:1.15rem;color:var(--gold-light);animation-delay:2.3s}
.sp-6{top:86%;right:15%;font-size:1.4rem;animation-delay:1.4s}
.sp-7{top:7%;left:48%;font-size:1rem;animation-delay:2.8s}
.sp-8{top:35%;right:5%;font-size:1.2rem;color:var(--gold-light);animation-delay:0.9s}

@keyframes sparkleGleam{
  0%,100%{transform:scale(0.3) rotate(0deg);opacity:0.18;filter:drop-shadow(0 0 2px var(--gold))}
  50%{transform:scale(1.3) rotate(22deg);opacity:1;filter:drop-shadow(0 0 9px var(--gold-light))}
}

main{min-height:100%;display:grid;place-items:center;padding:26px 18px;position:relative;z-index:2}

/* ==========================================
   APARIENCIA DE LA CARTA (CRISTAL Y ORO)
   ========================================== */
.card{
  position:relative;width:min(100%,435px);
  background:var(--card-bg);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-radius:32px;
  padding:48px 32px 42px;
  text-align:center;
  box-shadow:
    0 24px 60px -15px rgba(45, 30, 85, 0.25),
    0 8px 24px -6px rgba(0,0,0,0.06),
    inset 0 1px 1px rgba(255, 255, 255, 0.95);
  overflow:hidden;
  min-height:560px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  transition:transform 0.4s ease, box-shadow 0.4s ease, background 1.4s ease;
}

.card::before{
  content:"";position:absolute;inset:12px;
  border:1.4px solid var(--gold);border-radius:24px;
  opacity:0.7;pointer-events:none;
  box-shadow:0 0 16px var(--gold-glow);
  animation:borderPulse 4.5s ease-in-out infinite alternate;
}
.card::after{
  content:"";position:absolute;inset:17px;
  border:1.2px dashed var(--gold-light);border-radius:20px;
  opacity:0.5;pointer-events:none;
}
@keyframes borderPulse{
  0%{opacity:0.55;box-shadow:0 0 6px var(--gold-glow)}
  100%{opacity:0.95;box-shadow:0 0 20px var(--gold-glow)}
}

/* Esquineros dorados */
.corner{position:absolute;width:15px;height:15px;pointer-events:none;opacity:0.85}
.corner-tl{top:19px;left:19px;border-top:2.2px solid var(--gold);border-left:2.2px solid var(--gold)}
.corner-tr{top:19px;right:19px;border-top:2.2px solid var(--gold);border-right:2.2px solid var(--gold)}
.corner-bl{bottom:19px;left:19px;border-bottom:2.2px solid var(--gold);border-left:2.2px solid var(--gold)}
.corner-br{bottom:19px;right:19px;border-bottom:2.2px solid var(--gold);border-right:2.2px solid var(--gold)}

.step{
  display:none;flex-direction:column;align-items:center;gap:18px;width:100%;
  opacity:0;transform:scale(0.96) translateY(8px);
}
.step.on{
  display:flex;
  animation:stepFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes stepFade{
  0%{opacity:0;transform:scale(0.96) translateY(8px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}

h1,h2{font-family:"Fraunces",Georgia,serif;font-weight:400;line-height:1.15}
h1{font-size:clamp(2.3rem,9.4vw,3rem);letter-spacing:-0.4px}
h2{font-size:2.2rem;letter-spacing:-0.2px}
p{color:var(--muted);line-height:1.55;max-width:32ch}

.badge-crest{font-size:1.2rem;color:var(--gold);letter-spacing:4px;margin-bottom:-4px;opacity:0.95}
.cover-eyebrow{color:var(--muted);font-size:0.95rem;letter-spacing:0.3px;margin-bottom:-4px}
.cover-title{font-size:clamp(2.35rem, 9.6vw, 3.15rem);line-height:1.1;color:var(--ink);margin:0}
.names-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;margin:2px 0 4px}
.names{font-family:"Fraunces",serif;font-style:italic;font-size:1.38rem;color:var(--ink);letter-spacing:0.5px;font-weight:500}
.names-decor{font-size:0.75rem;color:var(--gold);letter-spacing:6px;opacity:0.85}

/* ==========================================
   INTRIGA EN PORTADA: BEBÉ NIÑO VS BEBÉ NIÑA
   ========================================== */
.mystery-container{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  margin:4px 0 8px;
}
.mystery-question-pill{
  font-size:0.82rem;
  font-weight:700;
  color:var(--gold);
  background:rgba(212, 155, 40, 0.12);
  border:1px solid rgba(212, 155, 40, 0.35);
  padding:3px 14px;
  border-radius:999px;
  letter-spacing:1px;
  text-transform:uppercase;
}
.mystery-pair{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:16px;
}
.gender-card{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  transition:transform 0.3s ease;
}
.gender-card:hover{
  transform:translateY(-3px) scale(1.04);
}
.gender-badge{
  width:72px;
  height:72px;
  border-radius:50%;
  display:grid;
  place-items:center;
  position:relative;
}
.gender-badge.boy{
  background:linear-gradient(145deg, #ffffff 0%, #e0f2fe 100%);
  border:2.5px solid #38bdf8;
  box-shadow:0 8px 22px rgba(56, 189, 248, 0.35);
  animation:floatBoy 3.5s ease-in-out infinite alternate;
}
.gender-badge.girl{
  background:linear-gradient(145deg, #ffffff 0%, #fce7f3 100%);
  border:2.5px solid #f472b6;
  box-shadow:0 8px 22px rgba(244, 114, 182, 0.35);
  animation:floatGirl 3.5s ease-in-out infinite alternate 0.5s;
}
@keyframes floatBoy{
  0%{transform:translateY(0) rotate(-2deg)}
  100%{transform:translateY(-6px) rotate(2deg)}
}
@keyframes floatGirl{
  0%{transform:translateY(0) rotate(2deg)}
  100%{transform:translateY(-6px) rotate(-2deg)}
}
.gender-tag{
  font-size:0.8rem;
  font-weight:700;
  padding:3px 11px;
  border-radius:999px;
  letter-spacing:0.3px;
}
.gender-tag.boy{
  background:#e0f2fe;
  color:#0284c7;
  border:1px solid #bae6fd;
}
.gender-tag.girl{
  background:#fce7f3;
  color:#db2777;
  border:1px solid #fbcfe8;
}
.mystery-center{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
}
.mystery-symbol{
  font-family:"Fraunces",serif;
  font-size:1.45rem;
  font-weight:600;
  color:var(--gold);
  width:38px;
  height:38px;
  border-radius:50%;
  background:linear-gradient(135deg, #fff9e6 0%, #ffeb99 100%);
  border:1.8px solid var(--gold);
  display:grid;
  place-items:center;
  box-shadow:0 0 14px var(--gold-glow);
  animation:pulseCenter 2s ease-in-out infinite;
}
@keyframes pulseCenter{
  0%,100%{transform:scale(0.95);box-shadow:0 0 8px var(--gold-glow)}
  50%{transform:scale(1.1);box-shadow:0 0 20px var(--gold-glow)}
}
.mystery-or{
  font-size:0.75rem;
  font-weight:700;
  color:var(--gold);
  text-transform:uppercase;
  letter-spacing:1px;
}

.stars{width:98px;height:auto;animation:starTwinkle 3.2s ease-in-out infinite alternate}
@keyframes starTwinkle{
  0%{transform:scale(0.98);opacity:0.85}
  100%{transform:scale(1.05);opacity:1;filter:drop-shadow(0 0 6px var(--gold-light))}
}

/* Botones llamativos con gradiente y destello */
button{
  position:relative;overflow:hidden;font:inherit;font-weight:600;cursor:pointer;border:0;
  border-radius:999px;padding:16px 40px;
  background:linear-gradient(135deg, #221c3b 0%, #3e3367 100%);
  color:#ffffff;
  box-shadow:0 8px 24px -4px rgba(34, 28, 59, 0.45);
  transition:transform .22s ease, box-shadow .22s ease, opacity .2s;
}
body.boy button:not(.ghost){
  background:linear-gradient(135deg, #09479e 0%, #0077e6 100%);
  box-shadow:0 8px 24px -4px rgba(9, 71, 158, 0.45);
}
button::after{
  content:"";position:absolute;top:-50%;left:-60%;width:40%;height:200%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.32),transparent);
  transform:rotate(25deg);transition:left 0.75s ease;
}
button:hover::after{left:135%}
button:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 12px 28px -6px rgba(34, 28, 59, 0.5)}
body.boy button:not(.ghost):hover{box-shadow:0 12px 28px -6px rgba(9, 71, 158, 0.55)}
button:active{transform:translateY(0) scale(0.98)}
button:focus-visible{outline:3px solid var(--boy);outline-offset:3px}
button.ghost{background:none;color:var(--muted);padding:8px 16px;font-size:.95rem;text-decoration:underline;box-shadow:none}
button.ghost:hover{color:var(--ink);transform:translateY(-1px);box-shadow:none}
button.ghost::after{display:none}

/* ==========================================
   GLOBO LLAMATIVO (FUSIÓN ROSA & AZUL CELESTIAL)
   ========================================== */
.balloon{
  position:relative;width:160px;height:245px;margin:8px 0 18px;
  animation:floatBalloon 4s ease-in-out infinite;
  filter:drop-shadow(0 14px 26px rgba(60,50,110,.22));
  display:flex;flex-direction:column;align-items:center;
}
.balloon .b{
  width:160px;height:185px;
  border-radius:50% 50% 48% 48% / 58% 58% 42% 42%;
  /* Fusión llamativa de rosa algodón y azul cian */
  background:
    radial-gradient(circle at 32% 24%, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.25) 24%, transparent 45%),
    linear-gradient(140deg, #ff7597 0%, #aa6ff8 48%, #20b8eb 100%);
  display:grid;place-items:center;
  font-family:"Fraunces",serif;font-size:5.2rem;color:#ffffff;
  text-shadow:0 2px 14px rgba(34, 28, 59, 0.35);
  box-shadow:inset -12px -16px 28px rgba(34, 28, 59, 0.3), inset 6px 6px 14px rgba(255,255,255,.5);
  transition:transform 0.15s ease;
  position:relative;
  z-index:2;
}
/* Cola del globo (nudo amarrado abajo y cuerda colgante) */
.balloon-tail{
  margin-top:-2px;
  transform-origin:top center;
  animation:stringWave 4s ease-in-out infinite;
  z-index:1;
  display:block;
}
@keyframes floatBalloon{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-14px) rotate(2.5deg)}}
@keyframes stringWave{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-6deg)}}

.balloon.shake{animation:balloonSuspense 0.75s cubic-bezier(0.36, 0.07, 0.19, 0.97) both}
@keyframes balloonSuspense{
  0%{transform:scale(1)}15%{transform:scale(1.05) rotate(-5deg)}30%{transform:scale(1.1) rotate(5deg)}
  45%{transform:scale(1.16) rotate(-7deg)}60%{transform:scale(1.22) rotate(7deg)}
  80%{transform:scale(1.3) rotate(-8deg)}95%{transform:scale(1.38) rotate(4deg)}100%{transform:scale(1.42) rotate(0deg)}
}
.balloon.pop{animation:popBurst 0.26s ease-out forwards}
@keyframes popBurst{
  0%{transform:scale(1.42);opacity:1}
  40%{transform:scale(1.9);opacity:0.6;filter:brightness(1.6) blur(2px)}
  100%{transform:scale(2.4);opacity:0;filter:blur(8px)}
}

/* ==========================================
   CUENTA REGRESIVA CON INTRIGA Y EMOCIÓN (5... 1)
   ========================================== */
.count-wrapper{position:relative;width:180px;height:180px;display:grid;place-items:center;margin:8px 0}
.count-ring{
  position:absolute;inset:0;border-radius:50%;
  border:3.5px solid var(--gold);opacity:0;transform:scale(0.5);
  box-shadow:0 0 25px var(--gold-glow);
}
.count-ring.pulse{animation:ringWave 1.3s cubic-bezier(0.1, 0.8, 0.2, 1)}
@keyframes ringWave{0%{transform:scale(0.5);opacity:0.95}100%{transform:scale(1.85);opacity:0}}

.count{
  font-family:"Fraunces",serif;font-size:8rem;line-height:1;font-weight:600;
  color:var(--gold);text-shadow:0 6px 28px var(--gold-glow);transform-origin:center center;
}
.count.tick-anim{animation:countPunch 1.25s cubic-bezier(0.18, 0.89, 0.32, 1.25)}
@keyframes countPunch{
  0%{transform:scale(2.4);opacity:0;filter:blur(6px)}
  35%{transform:scale(0.92);opacity:1;filter:blur(0)}
  65%{transform:scale(1.08)}
  100%{transform:scale(1);opacity:1}
}

.count-label{
  font-size:1.15rem;font-weight:500;color:var(--ink);letter-spacing:0.5px;
  min-height:1.8rem;animation:labelSlide 0.5s ease-out;
}
@keyframes labelSlide{
  0%{opacity:0;transform:translateY(6px)}
  100%{opacity:1;transform:translateY(0)}
}

/* ==========================================
   PASO 5: REVELACIÓN RADIANTE
   ========================================== */
.badge-wrap{
  position:relative;width:174px;height:174px;display:grid;place-items:center;margin-bottom:8px;
}
.badge-halo{
  position:absolute;inset:-20px;border-radius:50%;
  background:radial-gradient(circle, rgba(0, 140, 255, 0.5) 0%, rgba(247, 197, 82, 0.3) 50%, transparent 72%);
  animation:haloPulse 3.5s ease-in-out infinite alternate;
}
@keyframes haloPulse{
  0%{transform:scale(0.9) rotate(0deg);opacity:0.6}

<script>
// ==========================================
// ✏️ Personaliza los datos aquí
// ==========================================
const DATOS = {
  padres: "Luz & Miguel",
  bebe:   "Muy pronto: ¡bienvenido, pequeño!"
};

const $ = id => document.getElementById(id);
$("padres").textContent = DATOS.padres;
$("bebe").textContent = DATOS.bebe;

// ==========================================
// 🎶 SISTEMA DE AUDIO (Web Audio API + fallback MP3)
// ==========================================
const AudioManager = {
  ctx: null,
  musicRunning: false,
  timerId: null,
  stepIndex: 0,
  useExternalAudio: false,
  audioEl: $("audioElement"),

  freqs: {
    G3: 196.00, A3: 220.00, B3: 246.94,
    C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
    C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00, B5: 987.77,
    C6: 1046.50, D6: 1174.66, E6: 1318.51, F6: 1396.91, G6: 1567.98
  },

  score: [
    ['E5', 0.5, 'C4'], ['E5', 0.5], ['G5', 1.5],
    ['E5', 0.5, 'C4'], ['E5', 0.5], ['G5', 1.5],
    ['E5', 0.5, 'C4'], ['G5', 0.5], ['C6', 1.0], ['B5', 0.5], ['A5', 0.5],
    ['A5', 1.0, 'F4'], ['G5', 2.0],

    ['D5', 0.5, 'G3'], ['E5', 0.5], ['F5', 1.5],
    ['D5', 0.5, 'G3'], ['E5', 0.5], ['F5', 1.5],
    ['D5', 0.5, 'G3'], ['F5', 0.5], ['B5', 1.0], ['A5', 0.5], ['G5', 0.5],
    ['B5', 1.0, 'G4'], ['C6', 2.0, 'C4'],

    ['C5', 0.5, 'C4'], ['C5', 0.5], ['C6', 1.5, 'A4'], ['A5', 0.5], ['F5', 0.5],
    ['G5', 1.5, 'E4'], ['E5', 0.5], ['C5', 0.5],
    ['F5', 1.0, 'D4'], ['G5', 0.5], ['A5', 0.5], ['G5', 2.0, 'C4'],

    ['C5', 0.5, 'C4'], ['C5', 0.5], ['C6', 1.5, 'A4'], ['A5', 0.5], ['F5', 0.5],
    ['G5', 1.5, 'E4'], ['E5', 0.5], ['C5', 0.5],
    ['D5', 1.0, 'G3'], ['E5', 0.5], ['D5', 0.5], ['C5', 2.5, 'C4']
  ],

  init() {
    if (!this.ctx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) {
        this.ctx = new AudioContextClass();
      }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  },

  playMusicBoxTone(freq, time, duration = 1.3, vol = 0.08) {
    if (!this.ctx) return;
    try {
      const osc1 = this.ctx.createOscillator();
      const osc2 = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const gain2 = this.ctx.createGain();

      osc1.type = "sine";
      osc1.frequency.setValueAtTime(freq, time);

      osc2.type = "triangle";
      osc2.frequency.setValueAtTime(freq * 2.004, time);

      const now = time;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.008);
      gain.gain.exponentialRampToValueAtTime(vol * 0.35, now + 0.28);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      gain2.gain.setValueAtTime(vol * 0.25, now);
      gain2.gain.exponentialRampToValueAtTime(0.0001, now + duration * 0.4);

      osc1.connect(gain);
      osc2.connect(gain2);
      gain2.connect(gain);
      gain.connect(this.ctx.destination);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + duration);
      osc2.stop(now + duration);
    } catch(e) {}
  },

  // SUSPENSO CRECIENTE PARA EL CONTEO (5, 4, 3, 2, 1)
  playCountdownTone(count) {
    if (!this.ctx) return;
    try {
      const now = this.ctx.currentTime;

      // 1. Latido rítmico grave (Heartbeat boom con frecuencia creciente)
      const oscSub = this.ctx.createOscillator();
      const gainSub = this.ctx.createGain();
      oscSub.type = "sine";

      const baseFreq = 95 + (5 - count) * 22; // 95Hz, 117Hz, 139Hz, 161Hz, 183Hz
      oscSub.frequency.setValueAtTime(baseFreq, now);
      oscSub.frequency.exponentialRampToValueAtTime(38, now + 0.28);

      gainSub.gain.setValueAtTime(0.26 + (5 - count) * 0.04, now);
      gainSub.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);
      oscSub.connect(gainSub);
      gainSub.connect(this.ctx.destination);
      oscSub.start(now);
      oscSub.stop(now + 0.35);

      // 2. Acorde de tensión musical ascendente
      const oscPing = this.ctx.createOscillator();
      const oscPing2 = this.ctx.createOscillator();
      const gainPing = this.ctx.createGain();

      oscPing.type = "sine";
      oscPing2.type = "triangle";

      // Frecuencias ascendentes en cada segundo: 5 (La3), 4 (Do4), 3 (Mi4), 2 (La4), 1 (Do5 con barrido)
      const pingMap = { 5: 220.00, 4: 261.63, 3: 329.63, 2: 440.00, 1: 523.25 };
      const pingFreq = pingMap[count] || 440;

      oscPing.frequency.setValueAtTime(pingFreq, now);
      oscPing2.frequency.setValueAtTime(pingFreq * 1.5, now);

      if (count === 1) {
        // En el segundo final (1), barrido de suspenso hacia el agudo
        oscPing.frequency.exponentialRampToValueAtTime(987.77, now + 0.85);
        oscPing2.frequency.exponentialRampToValueAtTime(1479.98, now + 0.85);
      }

      gainPing.gain.setValueAtTime(0.001, now);
      gainPing.gain.linearRampToValueAtTime(0.2, now + 0.015);
      gainPing.gain.exponentialRampToValueAtTime(0.0001, now + (count === 1 ? 0.95 : 0.7));

      oscPing.connect(gainPing);
      oscPing2.connect(gainPing);
      gainPing.connect(this.ctx.destination);

      oscPing.start(now);
      oscPing2.start(now);
      oscPing.stop(now + 1.0);
      oscPing2.stop(now + 1.0);
    } catch(e) {}
  },

  playPop() {
    if (!this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(450, now);
      osc.frequency.exponentialRampToValueAtTime(75, now + 0.14);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.17);
    } catch(e) {}
  },

  playCelebration() {
    if (!this.ctx) return;
    const cascade = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00];
    cascade.forEach((freq, idx) => {
      setTimeout(() => {
        this.playMusicBoxTone(freq, this.ctx.currentTime, 2.0, 0.14);
      }, idx * 65);
    });
  },

  scheduleNextNote() {
    if (!this.musicRunning || this.useExternalAudio) return;
    const [note, beats, bass] = this.score[this.stepIndex];
    const beatSec = 0.78;
    const now = this.ctx.currentTime;

    if (note && this.freqs[note]) {
      this.playMusicBoxTone(this.freqs[note], now, beats * beatSec * 1.5, 0.075);
    }
    if (bass && this.freqs[bass]) {
      this.playMusicBoxTone(this.freqs[bass], now, beats * beatSec * 1.8, 0.048);
    }

    this.stepIndex = (this.stepIndex + 1) % this.score.length;
    this.timerId = setTimeout(() => {
      this.scheduleNextNote();
    }, beats * beatSec * 1000);
  },

  start() {
    this.init();
    if (this.musicRunning) {
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
      return;
    }
    this.musicRunning = true;

    if (this.audioEl && this.audioEl.canPlayType && this.audioEl.src) {
      this.audioEl.volume = 0.32;
      const playPromise = this.audioEl.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          this.useExternalAudio = true;
        }).catch(() => {
          this.useExternalAudio = false;
          this.scheduleNextNote();
        });
        return;
      }
    }
    this.scheduleNextNote();
  }
};

// ==========================================
// CONFETI FESTIVO VIBRANTE
// ==========================================
const cv = $("fx"), cx = cv.getContext("2d");
let parts = [], raf = 0;
function size(){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
size(); addEventListener("resize", size);

function burst(){
  // Colores vibrantes y festivos
  const colors = ["#0088ff", "#00d2ff", "#ffcf33", "#ff6b8b", "#ffffff", "#4361ee", "#ffd166", "#06d6a0"];
  const d = devicePixelRatio, ox = cv.width / 2, oy = cv.height * 0.44;

  for(let i = 0; i < 280; i++){
    const angle = Math.random() * Math.PI * 2;
    const speed = (5 + Math.random() * 13) * d;
    parts.push({
      x: ox, y: oy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - (5.5 * d),
      w: (7 + Math.random() * 8) * d,
      h: (4 + Math.random() * 6) * d,
      r: Math.random() * 6,
      vr: (Math.random() - 0.5) * 0.35,
      c: colors[i % colors.length],
      shape: Math.random() > 0.4 ? 'rect' : 'circle',
      life: 1,
      decay: 0.0032 + Math.random() * 0.002
    });
  }
  if (!raf) loop();
}

function loop(){
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => {
    p.vy += 0.27 * devicePixelRatio;
    p.vx *= 0.985;
    p.x += p.vx;
    p.y += p.vy;
    p.r += p.vr;
    p.life -= p.decay;

    cx.save();
    cx.globalAlpha = Math.max(p.life, 0);
    cx.translate(p.x, p.y);
    cx.rotate(p.r);
    cx.fillStyle = p.c;

    if (p.shape === 'circle') {
      cx.beginPath();
      cx.arc(0, 0, p.w / 2.2, 0, Math.PI * 2);
      cx.fill();
    } else {
      const scaleX = Math.cos(p.r * 2);
      cx.fillRect(-p.w / 2 * scaleX, -p.h / 2, p.w * scaleX, p.h);
    }
    cx.restore();
  });

  parts = parts.filter(p => p.life > 0 && p.y < cv.height + 50);
  raf = parts.length ? requestAnimationFrame(loop) : 0;
  if (!raf) cx.clearRect(0, 0, cv.width, cv.height);
}

// ==========================================
// REVELACIÓN Y ANIMACIÓN CON CONTEO EMOCIONAL
// ==========================================
const SUSPENSE_PHRASES = {
  5: "✨ ¿Están listos?...",
  4: "🌟 El gran misterio...",
  3: "💓 El corazón late con fuerza...",
  2: "🤫 ¡A sólo unos segundos!...",
  1: "🎉 ¡Aquí viene la sorpresa!..."
};

$("revelar").onclick = () => {
  AudioManager.init();
  const g = $("globo"); 
  g.classList.add("shake");
  $("revelar").disabled = true;

  setTimeout(() => {
    AudioManager.playPop();
    g.classList.add("pop");

    setTimeout(() => {
      show("s4");
      let n = 5; // Conteo de 5 a 1 con intriga

      const updateCountUI = (val) => {
        const el = $("num");
        const ring = $("countRing");
        const label = $("countLabel");

        el.textContent = val;
        label.textContent = SUSPENSE_PHRASES[val] || "✨ Preparando la sorpresa...";
        label.style.animation = "none";
        void label.offsetWidth;
        label.style.animation = "labelSlide 0.45s ease-out";

        el.classList.remove("tick-anim");
        ring.classList.remove("pulse");
        void el.offsetWidth;
        el.classList.add("tick-anim");
        ring.classList.add("pulse");

        AudioManager.playCountdownTone(val);
      };

      updateCountUI(n);

      const intervalDuration = 1350; // 1.35 segundos por número para generar intriga
      const t = setInterval(() => {
        n--;
        if (n > 0) {
          updateCountUI(n);
        } else {
          clearInterval(t);
          document.body.classList.add("boy");
          show("s5"); 
          
          // Celebración triunfal con doble explosión de confeti
          burst();
          AudioManager.playCelebration();
          setTimeout(burst, 500);
          setTimeout(burst, 1200);
        }
      }, intervalDuration);
    }, 280);
  }, 750);
};

$("repetir").onclick = () => {
  document.body.classList.remove("boy");
  const g = $("globo"); 
  g.className = "balloon";
  $("revelar").disabled = false;
  show("s1");
};
